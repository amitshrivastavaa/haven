<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0B0E'/%3E%3Cpath d='M16 25s7-3.5 7-8.7V7.9L16 5.3 9 7.9v8.4C9 21.5 16 25 16 25z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Haven — governed by Grenz</title>

    <!--
      Instrument Serif carries the one sentence; Archivo does the interface;
      JetBrains Mono is reserved for things a machine wrote — tool names,
      arguments, verdict codes. Preconnect so the display face is not the
      thing you watch reflow at 2am.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <meta
      name="description"
      content="A WebMCP demo: a smart home an AI agent can run — under a deny-by-default policy, with human approval, argument constraints and a live audit timeline."
    />

    <!--
      Grenz installs FIRST, as a classic (non-module) script.

      This ordering is the trust assumption, and it is why the install entry is
      shipped as an IIFE: module scripts are always deferred, so an ESM import
      would lose the race to any synchronous third-party <script> below it. By
      the time anything else runs, `registerTool` already belongs to Grenz.
    -->
    <!--
      Demo-only: an inert WebMCP stand-in that activates on ?polyfill=1, so the
      flow can be shown in a browser without the flag. It loads BEFORE Grenz
      because a native ModelContext would also exist before any script runs —
      the takeover derives its prototype from whatever instance is there.
    -->
    <script src="/webmcp-polyfill.js"></script>

    <script src="/grenz-install.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
