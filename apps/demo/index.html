<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d28d9'/%3E%3Cpath d='M16 25s7-3.5 7-8.7V7.9L16 5.3 9 7.9v8.4C9 21.5 16 25 16 25z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>JamBoard Jobs — governed by Grenz</title>
    <meta
      name="description"
      content="A WebMCP demo: a job board where an AI agent can search, draft and apply — under a deny-by-default policy with human approval and a live audit timeline."
    />

    <!--
      Grenz installs FIRST, as a classic (non-module) script.

      This ordering is the trust assumption, and it is why the install entry is
      shipped as an IIFE: module scripts are always deferred, so an ESM import
      would lose the race to any synchronous third-party <script> below it. By
      the time anything else runs, `registerTool` already belongs to Grenz.
    -->
    <!--
      Demo-only: an inert WebMCP stand-in that activates on ?polyfill=1, so the
      flow can be shown in a browser without the flag. It loads BEFORE Grenz
      because a native ModelContext would also exist before any script runs —
      the takeover derives its prototype from whatever instance is there.
    -->
    <script src="/webmcp-polyfill.js"></script>

    <script src="/grenz-install.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
