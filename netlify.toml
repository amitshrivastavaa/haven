# The app is static. The one endpoint behind it exists because a page cannot
# verify its own proof: /api/presence issues the WebAuthn challenge and checks
# the signature, which is the only part of an approval that has to happen
# somewhere the attacker cannot reach.
#
# If it fails to deploy the demo still works — the app probes for it at startup
# and, finding nothing, records approvals as unverified rather than refusing
# them. Degrading loudly beats failing shut on someone's front door.

[build]
  command = "bun install --frozen-lockfile && cd apps/haven && bun run build"
  publish = "apps/haven/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  BUN_VERSION = "1.3.14"

# grenz-install.js must never be served stale: it is the script that claims the
# registration surface, and a cached copy from a previous deploy would attach a
# different pipeline than the app bundle expects.
[[headers]]
  for = "/grenz-install.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Views are paths (/access, /history, /why) and the app resolves them itself,
# so every unknown path has to arrive as index.html rather than a 404. This
# does NOT shadow /api/presence: Netlify matches functions before redirects,
# and that function declares its own path in-file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
